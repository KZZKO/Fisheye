<!DOCTYPE html>
<html>

<head>
  <link href="css/style.css" rel="stylesheet" type="text/css" />
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Fisheye - photographe </title>
</head>

<body>
  <header>
    <a href="index.html" class="logo-link" aria-label="Retour à l'accueil">
      <img src="assets/images/logo.png" class="logo" alt="Fisheye logo" />
    </a>
  </header>
  <main id="main">
    <div class="photograph-header">
      <div class="photo-header-left">
        <h2 id="photographer-name"></h2>
        <p id="photographer-city"></p>
        <p id="photographer-tagline"></p>
      </div>
      <div class="photo-header-center">
        <button class="contact_button" onclick="displayModal()">Contactez-moi</button>
      </div>
      <div class="photo-header-right">
        <img id="photographer-picture" alt="Portrait du photographe" />
      </div>
    </div>
    <div id="photographe-album">

    </div>
    <div class="photographe-tab">

    </div>
  </main>
  <div id="contact_modal">
    <div class="modal">
      <header>
        <h2>Contactez-moi <span id="modal-photographer-name"></span></h2>
        <img src="assets/icons/close.svg" onclick="closeModal()" />
      </header>
      <form>
        <div>
          <label for="prenom">Prénom</label>
          <input type="text" id="prenom" name="prenom" placeholder="Prénom" maxlength="30" required>

          <label for="nom">Nom</label>
          <input type="text" id="nom" name="nom" placeholder="Nom" maxlength="30" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Email" maxlength="50" required>

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Entrer votre message" maxlength="700"
            required></textarea>
        </div>
        <button class="contact_button" onclick="submitcontact(event)">Envoyer</button>
      </form>
    </div>
  </div>
  <div id="media-modal" class="media-modal" aria-hidden="true" tabindex="-1" style="display:none;">
    <button class="left-arrow" aria-label="Média précédent">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <div class="mid-bloc">
      <div class="media-content" role="dialog" aria-modal="true">
      </div>
      <div class="media-title">

      </div>
    </div>
    <div class="right-bloc">
      <button class="close-modal" aria-label="Fermer">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <button class="right-arrow" aria-label="Média suivant">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
      <div></div>
    </div>
  </div>
  <script type="module" src="/scripts/pages/photographer.js"></script>
  <script src="/scripts/utils/contactForm.js"></script>
</body>

</html>
